<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f1e6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="RoS Hub">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Dashboard mobile per aprire rapidamente siti, demo e repository dei progetti locali.">
    <title>RoS GitHub Projects</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar" aria-label="Navigazione principale">
      <a class="brand" href="#home" aria-label="Vai all'inizio">
        <span>RoS</span>
        <small>GitHub Hub</small>
      </a>
      <nav id="cityFilters" class="city-filters" aria-label="Filtro citta"></nav>
      <label class="search-box" for="projectSearch">
        <span aria-hidden="true">⌕</span>
        <input id="projectSearch" type="search" placeholder="Cerca locale" autocomplete="off">
      </label>
    </header>

    <main id="home">
      <section class="intro" aria-labelledby="introTitle">
        <div class="intro__content">
          <p class="eyebrow">Hub operativo</p>
          <h1 id="introTitle">Dashboard locali</h1>
          <p>Gestisci e apri rapidamente siti, demo e repository dei progetti divisi per citta.</p>
        </div>
      </section>

      <div id="projects" class="projects" aria-live="polite"></div>
    </main>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
